name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-vuln:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Run Unit Tests
        run: go test -v -race ./pkg/...

  integration-tests:
    name: Root Integration & Cgroup Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Setup Cgroups v2 Delegation
        run: |
          # 1. Enable controllers on root cgroup if possible
          if [ -f /sys/fs/cgroup/cgroup.subtree_control ]; then
            for ctl in memory pids cpu; do
              sudo sh -c "echo +$ctl > /sys/fs/cgroup/cgroup.subtree_control" 2>/dev/null || true
            done
          fi

          # 2. Pre-create gojail root slice and delegate controllers
          sudo mkdir -p /sys/fs/cgroup/gojail
          if [ -f /sys/fs/cgroup/gojail/cgroup.subtree_control ]; then
            for ctl in memory pids cpu; do
              sudo sh -c "echo +$ctl > /sys/fs/cgroup/gojail/cgroup.subtree_control" 2>/dev/null || true
            done
          fi

          # 3. Ensure permissions across the cgroup hierarchy
          sudo chmod -R 777 /sys/fs/cgroup/gojail 2>/dev/null || true

      - name: Run Sandbox Root Integration Tests
        run: sudo -E env "PATH=$PATH" "GOCACHE=/tmp/go-build" "GOPATH=/tmp/go" go test -v ./pkg/sandbox/...

      - name: Run Server Recovery Root Tests
        run: sudo -E env "PATH=$PATH" "GOCACHE=/tmp/go-build" "GOPATH=/tmp/go" go test -v ./pkg/server/...

  build:
    name: Cross-Architecture Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -v -o bin/gojail-amd64 ./cmd/gojail
          go build -v -o bin/gojaild-amd64 ./cmd/gojaild

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -v -o bin/gojail-arm64 ./cmd/gojail
          go build -v -o bin/gojaild-arm64 ./cmd/gojaild
          